# Baut die iPhone-App in der Cloud (kostenlos für öffentliche Repos) – ganz ohne eigenen Mac.
# Ergebnis: RayBanClaude.ipa (unsigniert) → unter Windows mit Sideloadly + kostenloser Apple-ID installieren.
name: iOS-App bauen

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: IPA bauen
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode wählen (Swift 6.3+ für das Meta DAT SDK 1.x)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: xcodegen generate

      - name: App bauen (unsigniert)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project RayBanClaude.xcodeproj \
            -scheme RayBanClaude \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Compiler-Warnungen im eigenen Code
        working-directory: ios
        run: |
          grep -E "RayBanClaude/.*warning:" build.log | sed 's|.*/RayBanClaude/||' | sort -u | head -100 || true
          echo "Anzahl: $(grep -cE 'RayBanClaude/.*warning:' build.log || true)"

      - name: Fehlerausgabe
        if: failure()
        working-directory: ios
        run: grep -E -B2 -A6 "error:" build.log | head -300 || tail -200 build.log

      - name: IPA packen
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RayBanClaude.app Payload/
          zip -qry RayBanClaude.ipa Payload
          ls -lh RayBanClaude.ipa

      - name: IPA hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RayBanClaude-ipa
          path: ios/RayBanClaude.ipa
          retention-days: 30

  release:
    name: IPA an Release anhängen
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RayBanClaude-ipa
      - name: An Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" RayBanClaude.ipa --clobber --repo "$GITHUB_REPOSITORY"
