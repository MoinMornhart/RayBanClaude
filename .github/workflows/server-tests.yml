# Prüft Channel-Server (Bun) unter Windows, macOS und Linux sowie den Gateway-Build.
name: Server testen

on:
  push:
    branches: [main]
    paths: ["channel/**", "server/**", ".github/workflows/server-tests.yml"]
  pull_request:
    paths: ["channel/**", "server/**", ".github/workflows/server-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  channel:
    name: Channel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: channel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun audit

  gateway:
    name: Gateway (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
