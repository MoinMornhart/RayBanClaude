# XcodeGen-Projektbeschreibung – das .xcodeproj wird daraus erzeugt:
#   brew install xcodegen && cd ios && xcodegen generate
name: RayBanClaude
options:
  bundleIdPrefix: com.raybanclaude
  deploymentTarget:
    iOS: "17.2"          # Mindestversion des Meta Wearables DAT SDK 1.x
  xcodeVersion: "26.4"   # DAT SDK 1.x ist mit Swift 6.3 gebaut

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: "1.0.1"        # unterstützt offiziell Ray-Ban Meta Gen 1 und Gen 2

targets:
  RayBanClaude:
    type: application
    platform: iOS
    sources:
      - RayBanClaude
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
      # Experimentell (nur Entwicklermodus/Beta-Channel): Touchpad- und Tasten-Gesten der Brille
      - package: meta-wearables-dat-ios
        product: MWDATInputs
    settings:
      base:
        INFOPLIST_FILE: RayBanClaude/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(RAYBANCLAUDE_BUNDLE_ID)
        PRODUCT_NAME: RayBanClaude
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  RayBanClaude:
    build:
      targets:
        RayBanClaude: all
    run:
      config: Debug
    archive:
      config: Release
